<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revitget Web Viewer</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Import Maps for Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- 3D Viewer Container -->
    <div id="viewer-container"></div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="btn-reset" title="Reset View" class="tool-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
                <button id="btn-rotate" title="Auto Rotate" class="tool-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </button>
            </div>
            <div class="toolbar-group">
                <div class="info-text">Revitget Viewer</div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">Loading Model...</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="error-toast" class="error-toast hidden">
            <span id="error-message">Error loading model</span>
            <button id="btn-close-error">✕</button>
        </div>
        
        <!-- Stats/Info Panel (Optional) -->
        <div id="stats-panel" class="stats-panel hidden"></div>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
